controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_command_controller:
      type: forward_command_controller/ForwardCommandController

forward_command_controller:
  ros__parameters:
    joints:
      - joint_coxa_lf
      - joint_coxa_lm
      - joint_coxa_lr
      - joint_coxa_rf
      - joint_coxa_rm
      - joint_coxa_rr
      - joint_femur_lf
      - joint_femur_lm
      - joint_femur_lr
      - joint_femur_rf
      - joint_femur_rm
      - joint_femur_rr
      - joint_tibia_lf
      - joint_tibia_lm
      - joint_tibia_lr
      - joint_tibia_rf
      - joint_tibia_rm
      - joint_tibia_rr

    interface_name: velocity
    command_topic: "/commands"
